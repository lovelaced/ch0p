name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release on a tag push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (JVM)
        run: >
          ./gradlew --no-daemon --stacktrace
          :edit-engine:test
          :ingest:testDebugUnitTest
          :analysis:testDebugUnitTest
          :render:testDebugUnitTest
          :models:testDebugUnitTest

      - name: Native host test
        run: bash tools/hosttest.sh

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ch0p-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          body: |
            Debug-signed APK for sideloading. **Uninstall any previous version first** —
            debug keystores regenerate per CI run, so signatures won't match.

            On-device ML models (Whisper, YAMNet, Silero, NIMA, face, Gemma) are downloaded
            on demand from the in-app Models screen; they are not bundled in the APK.
